name: Update air readings

on:
  schedule:
    - cron: '17 * * * *'     # every hour, at 17 minutes past (UTC)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: air
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch readings
        env:
          DATA_GOV_SG_KEY: ${{ secrets.DATA_GOV_SG_KEY }}
        run: node .github/scripts/fetch-air.mjs
      - name: Save if changed
        run: |
          git config user.name "air-bot"
          git config user.email "air-bot@users.noreply.github.com"
          git add air.json
          git diff --cached --quiet || (git commit -m "Air readings $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
